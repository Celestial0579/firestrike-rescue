# Leuchtfeuer: Strg+Alt+Entf startet keinen Neustart, auch nicht siebenmal in zwei Sekunden.
# ctrl-alt-del.target ist maskiert (build/chroot-setup.sh), und ohne diese Zeile führte die
# Folge reboot-force aus: ohne die Befehle der Einheiten beim Stoppen, aber mit systemd-shutdown
# und /run/initramfs/shutdown, die root während einer Claude-Freigabe geändert haben kann.
[Manager]
CtrlAltDelBurstAction=none
