# Firestrike Rescue @VERSION@ – GRUB-Menü (UEFI und BIOS)
set default=0
set timeout=10
set timeout_style=menu

# Serielle Konsole zusätzlich (Server, CI-Tests)
serial --unit=0 --speed=115200
terminal_input console serial

insmod all_video
insmod gfxterm
insmod png
loadfont /boot/grub/fonts/unicode.pf2
set gfxmode=auto
if terminal_output gfxterm serial; then
	loadfont /boot/grub/themes/firestrike/title.pf2
	loadfont /boot/grub/themes/firestrike/menu.pf2
	loadfont /boot/grub/themes/firestrike/small.pf2
	set theme=/boot/grub/themes/firestrike/theme.txt
else
	terminal_output console serial
fi
set menu_color_normal=light-gray/black
set menu_color_highlight=black/brown

# Gemeinsame Kernelparameter:
#  live-media      casper sucht das System nur auf dem Stick (keine fremden Disks einhängen)
#  noswap, systemd.swap=0  niemals Swap-Partitionen fremder Disks benutzen
#  fsck.mode=skip  keine Prüfläufe auf fremden Dateisystemen
set frs_args="boot=casper live-media=/dev/disk/by-label/FRS_RESCUE noswap systemd.swap=0 fsck.mode=skip noprompt locale=de_DE.UTF-8 keyboard-configuration/layoutcode=de console=ttyS0,115200 console=tty0"

menuentry "Firestrike Rescue starten" --id frs {
	linux /casper/vmlinuz $frs_args quiet ---
	initrd /casper/initrd
}
menuentry "Firestrike Rescue in den RAM laden (Stick danach abziehbar)" --id frs-toram {
	linux /casper/vmlinuz $frs_args toram quiet ---
	initrd /casper/initrd
}
menuentry "Sicherer Grafikmodus (nomodeset)" --id frs-safe {
	linux /casper/vmlinuz $frs_args nomodeset ---
	initrd /casper/initrd
}
if [ "$grub_platform" = "efi" ]; then
	if [ -f /boot/memtest86+x64.efi ]; then
		menuentry "Arbeitsspeicher testen (memtest86+, Secure Boot aus)" {
			linux /boot/memtest86+x64.efi
		}
	fi
	menuentry "Von der Festplatte starten" {
		exit
	}
	menuentry "UEFI-Firmware-Einstellungen" {
		fwsetup
	}
else
	if [ -f /boot/memtest86+x64.bin ]; then
		menuentry "Arbeitsspeicher testen (memtest86+)" {
			linux16 /boot/memtest86+x64.bin
		}
	fi
fi
