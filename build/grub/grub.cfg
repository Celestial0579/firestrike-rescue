# Leuchtfeuer @VERSION@ – GRUB-Menü (UEFI und BIOS)
set default=0
set timeout=10
set timeout_style=menu

# Serielle Konsole zusätzlich (Server, CI-Tests)
serial --unit=0 --speed=115200
terminal_input console serial

insmod all_video
insmod gfxterm
insmod png
loadfont /boot/grub/fonts/unicode.pf2
set gfxmode=auto
if terminal_output gfxterm serial; then
	loadfont /boot/grub/themes/leuchtfeuer/title.pf2
	loadfont /boot/grub/themes/leuchtfeuer/menu.pf2
	loadfont /boot/grub/themes/leuchtfeuer/small.pf2
	set theme=/boot/grub/themes/leuchtfeuer/theme.txt
else
	terminal_output console serial
fi
set menu_color_normal=light-gray/black
set menu_color_highlight=black/brown

# Gemeinsame Kernelparameter:
#  live-media      casper nimmt das System nur aus /run/lf-medium. Dort hängt das Skript
#                  casper-premount/lf_medium der initrd das Medium ein, nachdem es UUID und
#                  Prüfsumme des squashfs geprüft hat. LIVEMEDIA_TIMEOUT in /etc/casper.conf
#                  (build/chroot-setup.sh) verhindert, dass casper anderswo sucht.
#  noswap, systemd.swap=0  niemals Swap-Partitionen fremder Disks benutzen
#  fsck.mode=skip  keine Prüfläufe auf fremden Dateisystemen
set lf_args="boot=casper live-media=/run/lf-medium noswap systemd.swap=0 fsck.mode=skip noprompt locale=de_DE.UTF-8 keyboard-configuration/layoutcode=de console=ttyS0,115200 console=tty0"

menuentry "Leuchtfeuer starten" --id lf {
	linux /casper/vmlinuz $lf_args quiet ---
	initrd /casper/initrd
}
menuentry "Leuchtfeuer in den RAM laden (Stick danach abziehbar)" --id lf-toram {
	linux /casper/vmlinuz $lf_args toram quiet ---
	initrd /casper/initrd
}
menuentry "Sicherer Grafikmodus (nomodeset)" --id lf-safe {
	linux /casper/vmlinuz $lf_args nomodeset ---
	initrd /casper/initrd
}
if [ "$grub_platform" = "efi" ]; then
	if [ -f /boot/memtest86+x64.efi ]; then
		menuentry "Arbeitsspeicher testen (memtest86+, Secure Boot aus)" {
			linux /boot/memtest86+x64.efi
		}
	fi
	menuentry "Von der Festplatte starten" {
		exit
	}
	menuentry "UEFI-Firmware-Einstellungen" {
		fwsetup
	}
else
	if [ -f /boot/memtest86+x64.bin ]; then
		menuentry "Arbeitsspeicher testen (memtest86+)" {
			linux16 /boot/memtest86+x64.bin
		}
	fi
fi
