# Leuchtfeuer @VERSION@ – Start-Stub auf der EFI-Partition (build/build.sh legt ihn an)
#
# Der signierte GRUB von Ubuntu lädt seine Konfiguration aus /boot/grub auf dem Gerät, von dem er
# gestartet wurde. Fehlt der Ordner dort, durchsucht er alle Geräte nach /.disk/info und nimmt die
# erste Disk mit einer solchen Datei, auch eine fremde. Beim Start vom Stick ist das Gerät die
# EFI-Partition. Dieser Stub liegt dort unter /boot/grub: GRUB sucht dann nicht. Er nimmt das
# Dateisystem der ISO nur von derselben Disk und nur über die UUID dieser ISO.
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial

set lf_uuid="@ISO_UUID@"
set lf_found=""
regexp --set=1:lf_disk '^([^,]+)' "$root"
for lf_dev in "$lf_disk" "$lf_disk,gpt1" "$lf_disk,msdos1"; do
	if [ -z "$lf_found" ]; then
		set lf_u=""
		probe --set=lf_u --fs-uuid "($lf_dev)"
		if [ "$lf_u" = "$lf_uuid" ]; then
			set lf_found="$lf_dev"
		fi
	fi
done

if [ -n "$lf_found" ]; then
	echo "Leuchtfeuer: Startmedium ($lf_found) auf derselben Disk"
	set root="$lf_found"
	set prefix="($lf_found)/boot/grub"
	configfile /boot/grub/grub.cfg
else
	echo "Leuchtfeuer: Das Dateisystem dieser ISO ($lf_uuid) liegt nicht auf der Disk $lf_disk."
	echo "Auf anderen Disks wird nicht gesucht. Der Start wird abgebrochen."
	sleep 30
	exit
fi
