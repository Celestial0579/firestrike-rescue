name: Build ISO

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Monatlich am 15. um 03:00 UTC: frischer Build mit allen Ubuntu-Updates
    - cron: "0 3 15 * *"
  workflow_dispatch:
    inputs:
      release:
        description: "Als GitHub Release veröffentlichen"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # Die Libs werden gemeinsam geladen, Variablen aus anderen Dateien (SC2034) sind kein Fehler.
          # /run/frs gehört dem Benutzer rescue, Umleitungen hinter sudo (SC2024) sind dort gewollt.
          shellcheck -x -s bash --severity=warning -e SC2016,SC2024,SC2029,SC2034 \
            build/build.sh build/chroot-setup.sh rescue/frs rescue/bin/* rescue/lib/*.sh tests/*.sh
      - name: Unit-Tests
        run: |
          sudo apt-get install -y -qq jq
          bash tests/unit-clone-plan.sh

  build:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Version bestimmen
        id: ver
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="26.04-$(date -u +%Y%m%d)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Platz auf dem Runner schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null
          df -h /
      - name: ISO bauen (Ubuntu 26.04 Container)
        run: |
          docker run --rm --privileged \
            -v "$PWD:/src" -e FRS_VERSION="${{ steps.ver.outputs.version }}" \
            -e WORK=/tmp/frs-work -e OUT=/src/out \
            ubuntu:26.04 /src/build/build.sh
          sudo chown -R "$(id -u):$(id -g)" out
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: iso
          path: out/
          retention-days: 14
          compression-level: 0

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [selftest, uefi, bios]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: iso
          path: out
      - name: QEMU einrichten (mit KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 ovmf xorriso
      - name: Boot-Test ${{ matrix.mode }}
        run: tests/qemu-smoke.sh out/*.iso ${{ matrix.mode }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.mode }}
          path: smoke-*.log

  release:
    needs: [build, test]
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: iso
          path: out
      - name: Prüfsummen
        run: cd out && sha256sum *.iso > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/*.iso
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v$VERSION"
          gh release create "$tag" out/*.iso out/SHA256SUMS out/*.manifest \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Firestrike Rescue $VERSION" \
            --notes "Ubuntu 26.04 LTS mit allen Updates bis $(date -u +%F). Mit Rufus (DD-Modus), balenaEtcher oder dd auf einen USB-Stick schreiben. Prüfsummen: SHA256SUMS. Herkunft prüfen: gh attestation verify <iso> --repo $GITHUB_REPOSITORY"
