name: Build ISO

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Monatlich am 15. um 03:00 UTC: frischer Build mit allen Ubuntu-Updates
    - cron: "0 3 15 * *"
  workflow_dispatch:
    inputs:
      release:
        description: "Als GitHub Release veröffentlichen"
        type: boolean
        default: false

permissions:
  contents: read

# Abgebrochen werden nur Läufe von Pull Requests, wenn ein neuerer Stand kommt. Läufe auf main,
# nach Zeitplan und für Tags laufen zu Ende und stehen je in einer eigenen Gruppe: Sonst bricht
# ein Push auf main den geplanten Release-Lauf ab, und der nächste kommt erst einen Monat später.
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # Die Libs werden gemeinsam geladen, Variablen aus anderen Dateien (SC2034) sind kein Fehler.
          # /run/lf gehört dem Benutzer rescue, Umleitungen hinter sudo (SC2024) sind dort gewollt.
          shellcheck -x -s bash --severity=warning -e SC2016,SC2024,SC2029,SC2034 \
            build/build.sh build/chroot-setup.sh rescue/lf rescue/bin/* rescue/lib/*.sh tests/*.sh
      # Präparierte Falldateien: Nichts daraus darf ausgeführt werden.
      # Expertenwerkzeuge: kein Start ohne Ziel-Bestätigung.
      # Fortsetzen: Die Quelle wählt der Techniker, nie die Falldatei.
      # Ziel-Dateisysteme: Einhängen nur mit Schutzoptionen, am Einhängepunkt nachgeprüft.
      # Namen von der Ziel-Disk: nie Option, nie Befehl (auch mit echtem whiptail geprüft).
      # Claude: Texte von Datenträgern stehen in einer Datendatei, nie in einer CLAUDE.md.
      # Persistenter Speicher: nur vom eigenen Stick, nie ungefragt, lf.conf als Daten.
      # Klon-Job: Label und Namen der Quelle werden nie zum Befehl.
      # Image-Partitionen: nur lesend und mit Schutzoptionen, am Einhängepunkt nachgeprüft.
      # Fortsetzen: Die Suche nach Rettungsfällen schreibt nicht.
      # Dialoge: Texte von Datenträgern nur gefiltert (auch mit echtem whiptail geprüft).
      # Sperre für Claude: Der Hook entscheidet, nicht das Modell. Mit der CLI der ISO prüft es
      # der Selbsttest im Boot-Test (selftest_claude).
      # Disks: nur über eine eindeutige Kennung, bestätigt wird das Gerät, das beschrieben wird.
      # Boot: casper durchsucht keine fremden Disks. GRUB und initrd nehmen nur das geprüfte Medium.
      # Werkzeuge: Ein Fehler wird gemeldet, die Ausgabe erreicht das Terminal nur gefiltert.
      # lf.conf: Was die Vorlage nennt, wirkt. Der Name im Bericht ist Text, nie Befehl.
      # P2V: Werte nur geprüft und einzeln gequotet zum Knoten, nur der bestätigte SSH-Schlüssel,
      # Kopier-Job nur für schreibgeschützte Quellen. Echt (sshd, qemu-nbd) prüft es selftest_p2v.
      # Hängende Disk: weiter nur mit genau derselben Disk, die Lücke wird nachgeholt (echtes ddrescue).
      # SSH: keine Hostschlüssel im ISO, eigene je Start, Fingerabdruck im Dialog.
      - name: Schutz-Tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq whiptail gddrescue
          bash tests/unit-casefile.sh
          bash tests/unit-expert-confirm.sh
          bash tests/unit-resume-source.sh
          bash tests/unit-target-mount.sh
          bash tests/unit-case-names.sh
          bash tests/dialog-menu-entries.sh
          bash tests/unit-claude-context.sh
          bash tests/unit-persist.sh
          bash tests/unit-clone-job.sh
          bash tests/unit-image-mount.sh
          bash tests/unit-image-attach.sh
          bash tests/unit-target-search.sh
          bash tests/unit-dialog-text.sh
          bash tests/dialog-disk-text.sh
          bash tests/unit-claude-guard.sh
          bash tests/unit-claude-wrapper.sh
          bash tests/unit-lf-lesen.sh
          bash tests/unit-lf-aufgabe.sh
          bash tests/unit-claude-skills.sh
          bash tests/unit-disk-identity.sh
          bash tests/unit-boot-config.sh
          bash tests/unit-boot-medium.sh
          bash tests/unit-runv.sh
          bash tests/unit-lf-conf.sh
          bash tests/unit-p2v.sh
          bash tests/unit-ssh-hostkeys.sh
          bash tests/unit-hang.sh
      - name: Unit-Tests
        run: |
          sudo apt-get install -y -qq jq whiptail
          bash tests/unit-clone-plan.sh
          bash tests/unit-safety-confirm.sh
      # Zeichnet den Bestätigungsdialog mit echtem whiptail in ein Pseudo-Terminal.
      - name: Dialogtest
        run: bash tests/dialog-safety-confirm.sh

  build:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version bestimmen
        id: ver
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="26.04-$(date -u +%Y%m%d)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Platz auf dem Runner schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null
          df -h /
      - name: ISO bauen (Ubuntu 26.04 Container)
        run: |
          docker run --rm --privileged \
            -v "$PWD:/src" -e LF_VERSION="${{ steps.ver.outputs.version }}" \
            -e WORK=/tmp/lf-work -e OUT=/src/out \
            ubuntu:26.04 /src/build/build.sh
          sudo chown -R "$(id -u):$(id -g)" out
          ls -lh out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iso
          path: out/
          retention-days: 14
          compression-level: 0

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [selftest, uefi, uefi-usb, bios]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iso
          path: out
      - name: QEMU einrichten (mit KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 ovmf xorriso
      - name: Boot-Test ${{ matrix.mode }}
        run: tests/qemu-smoke.sh out/*.iso ${{ matrix.mode }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ matrix.mode }}
          path: smoke-*.log

  release:
    needs: [build, test]
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iso
          path: out
      - name: Prüfsummen
        run: cd out && sha256sum *.iso > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.iso
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Solange das Projekt in der Beta ist: Tag mit -beta, Release als Vorabversion
          # Ziel (#52): Ein Tag-Lauf nennt kein --target. Das Tag gibt es schon, und ein --target auf
          # einen Commit, der hinter main liegt und dessen Workflow von main abweicht, verlangt das
          # Recht workflows, das github.token nie hat (HTTP 403). --verify-tag legt kein Tag an.
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            ziel=(--verify-tag)
          else
            tag="v$VERSION-beta"
            ziel=(--target "$GITHUB_SHA")
          fi
          # Die Version trägt das Datum. Ein zweiter Lauf am selben Tag ergäbe denselben Tag.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Das Release $tag gibt es schon. Für ein weiteres Release am selben Tag ein eigenes Tag v… setzen."
            exit 1
          fi
          create() {
            gh release create "$tag" out/*.iso out/SHA256SUMS out/*.manifest \
              --repo "$GITHUB_REPOSITORY" "${ziel[@]}" --prerelease \
              --title "Leuchtfeuer $VERSION (Beta)" \
              --notes "Ubuntu 26.04 LTS mit allen Updates bis $(date -u +%F). Mit Rufus (DD-Modus), balenaEtcher oder dd auf einen USB-Stick schreiben. Prüfsummen: SHA256SUMS. Herkunft prüfen: gh attestation verify <iso> --repo $GITHUB_REPOSITORY"
          }
          if ! create; then
            # Diagnose (#52): Eine Anfrage ohne tag_name lehnt die API ab (422), ohne etwas anzulegen.
            # Bei fehlenden Rechten antwortet sie 403 und nennt das verlangte Recht im Header.
            echo "::warning::gh release create fehlgeschlagen. Diagnose, dann ein zweiter Versuch in 60 s."
            gh api -i -X POST "repos/$GITHUB_REPOSITORY/releases" -f name=lf-diagnose 2>&1 |
              grep -iE '^HTTP/|^x-accepted-github-permissions|^x-github-request-id|"message"' || true
            sleep 60
            # Ist beim ersten Versuch ein Release entstanden (etwa ohne alle Dateien), wird es nicht ersetzt.
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::Das Release $tag ist beim ersten Versuch entstanden, aber unvollständig. Bitte prüfen."
              exit 1
            fi
            create
          fi
